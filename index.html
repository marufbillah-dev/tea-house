<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container mx-auto ">
        <!-- hero section -->
      <section id="hero" class="flex justify-center gap-2.5 items-center my-[65px]">
        <!-- hero contents -->
        <div class="hero-contents max-w-[628px] space-y-[30px]">
          <h1 class="text-[5rem] font-extrabold text-[#1C1C1C]">
            It's good<br />tea time at The<br />Tea House
          </h1>
          <p class="font-medium text-[1.125rem] leading-8 text-[#777777]">
            Tea and Botanical Solutions Supplier Give Optimum<br />Satisfaction
            To Your Taste Buds.
          </p>
          <button
            class="bg-linear-to-r to-[#FF0000] from-[#FF8938] py-4 px-5 rounded-xl font-bold text-[1.25rem] text-white cursor-pointer"
          >
            Explore More <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </button>
        </div>
        <!-- hero image/banner -->
        <div class="hero-image relative">
          <img src="./images/banner.png" alt="" />
          <div class="image-badge bg-white flex justify-center gap-4 items-center py-5 px-6 rounded-xl shadow-lg w-fit z-50 absolute bottom-3 left-25">
            <div class="badge-icon text-[#FFDC64] text-4xl">
              <i class="fa-solid fa-star"></i>
            </div>
            <div class="badge-content">
              <h3 class="rating font-extrabold text-3xl">5.00</h3>
              <p class="font-semibold text-[1rem] text-[#777777]">Trust Pilot Ratings</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
